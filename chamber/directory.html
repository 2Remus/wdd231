<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber of Commerce - Business Directory</title>
    <meta name="description" content="Explore the local business directory to discover and support members of our Chamber of Commerce.">
    <meta name="author" content="Your Name">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">


    <meta property="og:title" content="Chamber of Commerce Business Directory">
    <meta property="og:description" content="Discover local businesses and chamber members in our interactive directory.">
    <meta property="og:image" content="https://your-username.github.io/wdd231/chamber/images/og-share.jpg">
    <meta property="og:url" content="https://your-username.github.io/wdd231/chamber/directory.html">


    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css" media="(min-width: 640px)">
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="images/logo.webp" alt="Chamber Logo" width="80" height="80">
            <h1>Chamber of Commerce</h1>
        </div>
        <nav>
            <button id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
            <ul id="nav-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#" class="active">Directory</a></li>
                <li><a href="#">Join</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="directory-controls">
            <h2>Business Directory</h2>
            <div class="toggle-buttons">
                <button id="grid-view" class="active" aria-label="Grid View">Grid View</button>
                <button id="list-view" aria-label="List View">List View</button>
            </div>
        </section>

        <article id="member-container" class="grid-layout"></article>
    </main>

    <footer>
        <div class="footer-contact">
            <p><strong>Chamber of Commerce HQ</strong></p>
            <p>123 Main Street, Cityville</p>
            <p>info@chamber.org | (555) 000-1111</p>
        </div>
        <div class="footer-meta">
            <p>&copy; <span id="current-year"></span> | Your Full Name | WDD 231</p>
            <p>Last Modified: <span id="last-modified"></span></p>
        </div>
    </footer>

    <script src="scripts/directory.js" defer></script>
</body>
</html>
